[package]
name = "xd"
version = "0.3.0"
edition = "2021"

[dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
chrono = "0.4"
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
dirs = "5.0"
ratatui-code-editor = "0.0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
regex = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
similar = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
ratatui-image = { version = "10.0", default-features = false, features = ["crossterm", "image-defaults"] }
ratatui-markdown = { version = "0.3.6", default-features = false, features = [
    "markdown",
    "image",
    "highlight-lang-bash",
    "highlight-lang-c",
    "highlight-lang-cpp",
    "highlight-lang-css",
    "highlight-lang-diff",
    "highlight-lang-go",
    "highlight-lang-html",
    "highlight-lang-java",
    "highlight-lang-javascript",
    "highlight-lang-json",
    "highlight-lang-lua",
    "highlight-lang-python",
    "highlight-lang-ruby",
    "highlight-lang-rust",
    "highlight-lang-sql",
    "highlight-lang-toml",
    "highlight-lang-typescript",
    "highlight-lang-xml",
    "highlight-lang-yaml",
] }
ratatui029 = { package = "ratatui", version = "0.29", default-features = false }
pulldown-cmark = "0.13"
ratatui-binary-data-widget = "0.1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["term", "poll", "fs", "process", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
urlencoding = "2.1"

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
trash = "5"

[target.'cfg(target_os = "windows")'.dependencies]
trash = "5"
