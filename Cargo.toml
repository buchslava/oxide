[package]
name = "xd"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = "3"
chrono = "0.4"
ratatui = "0.29"
crossterm = "0.29"
dirs = "5.0"
ratatui-code-editor = "0.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
regex = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
similar = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
ratatui-image = { version = "9.0", default-features = false, features = ["crossterm", "image-defaults"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["term", "poll", "fs", "process", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
urlencoding = "2.1"

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
trash = "5"

[target.'cfg(target_os = "windows")'.dependencies]
trash = "5"
